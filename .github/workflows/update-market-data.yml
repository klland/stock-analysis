name: Update market data

on:
  schedule:
    # GitHub Actions schedules use UTC. Run hourly after the Taiwan close
    # because GitHub cron can be delayed and TWSE/TPEx files can publish late.
    # 08:10-15:10 UTC = 16:10-23:10 Asia/Taipei on weekdays.
    - cron: "10 8-15 * * 1-5"
    # Morning catch-up for any prior delayed or skipped exchange/API publish.
    - cron: "30 23 * * 0-5"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: update-market-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Refresh market data
        run: node scripts/update-market-data.mjs

      - name: Check JavaScript syntax
        run: |
          node --check app.js
          node --check data/market-manifest.js
          node --check data/market-data.js
          node --check data/market-history.js
          for file in data/history/*.js; do node --check "$file"; done

      - name: Audit required symbols
        run: |
          node <<'NODE'
          global.window = {};
          require('./data/market-manifest.js');
          require('./data/market-data.js');
          require('./data/market-history.js');
          const requiredDcaSeries = ['0050', '006208', '00735', '00981A', '2308', '2317', '2330', '2454', 'AAPL', 'SPY', 'MU', 'SNDK'];
          requiredDcaSeries.forEach((symbol) => require('./data/history/' + symbol + '.js'));
          const m = global.window.TWSE_MARKET_MANIFEST;
          const d = global.window.TWSE_MARKET_DATA;
          const h = global.window.TWSE_MARKET_HISTORY;
          const chunks = global.window.TWSE_MARKET_HISTORY_CHUNKS || {};
          if (!m?.version || m.version !== d.fetchedAt || m.version !== h.fetchedAt || m.dataDate !== d.history?.latestDate) {
            console.error('Market manifest does not match summary and history payloads.');
            process.exit(1);
          }
          const has = (s) => d.daily.some((r) => r.Code === s) ||
            d.tpexDaily.some((r) => r['代號'] === s) ||
            d.usDaily.some((r) => r.symbol === s);
          const required = ['00631L', '00981A', '00735', 'AAPL', 'SPY', 'MU', 'SNDK'];
          const missing = required.filter((symbol) => !has(symbol));
          if (missing.length) {
            console.error('Missing required symbols: ' + missing.join(', '));
            process.exit(1);
          }
          if (d.usDaily.length !== 216 || new Set(d.usDaily.map((row) => row.symbol)).size !== 216) {
            console.error('US universe must contain 200 companies plus 16 tracked ETFs.');
            process.exit(1);
          }
          const historyPeriods = ['1w', '1m', '1y'];
          const missingHistory = historyPeriods.filter((period) => !d.history?.periods?.[period]?.date || Object.keys(d.history.periods[period].closes || {}).length < 100);
          if (missingHistory.length) {
            console.error('Missing historical snapshots: ' + missingHistory.join(', '));
            process.exit(1);
          }
          const requiredHistorySymbols = ['2330', '0050', '2454'];
          const missingHistorySymbols = historyPeriods.flatMap((period) =>
            requiredHistorySymbols
              .filter((symbol) => !d.history.periods[period].closes?.[symbol])
              .map((symbol) => period + ':' + symbol)
          );
          if (missingHistorySymbols.length) {
            console.error('Missing TWSE history symbols: ' + missingHistorySymbols.join(', '));
            process.exit(1);
          }
          const missingDcaSeries = requiredDcaSeries.filter((symbol) => (chunks[symbol]?.points || []).length < 120);
          if (missingDcaSeries.length) {
            console.error('Missing DCA daily series: ' + missingDcaSeries.join(', '));
            process.exit(1);
          }
          console.log('Market data date ' + d.date + '; TWSE ' + d.daily.length + ', TPEx ' + d.tpexDaily.length + ', companies ' + d.companies.length + ', US ' + d.usDaily.length + ', history ' + historyPeriods.join('/') + ', DCA series ' + (h.history?.symbols || []).length + '.');
          NODE

      - name: Commit refreshed data
        run: |
          if git diff --quiet -- data/market-manifest.js data/market-data.js data/market-history.js data/history; then
            echo "No market data changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/market-manifest.js data/market-data.js data/market-history.js data/history
          git commit -m "chore: update market data"
          git push
